name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Create local.properties
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

    - name: Build APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    # THIS IS THE NEW STEP THAT RENAMES THE FILE
    - name: Rename APK
      run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ColorNest.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ColorNest-APK
        path: android/app/build/outputs/apk/debug/ColorNest.apk
