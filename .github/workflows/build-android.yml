name: Build ColorNest Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk ColorNest.apk
      - name: Create or update latest test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest \
              --title "ColorNest - Latest Test Build" \
              --notes "Latest automatically built ColorNest debug APK for testing." \
              --prerelease
          fi
          gh release upload debug-latest ColorNest.apk --clobber
